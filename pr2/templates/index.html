<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Извлечение MP3</title>
<h1>Извлечение звука из MP4</h1>
<form id="convert">
  <label>Видео MP4 <input id="video" type="file" accept=".mp4" required></label>
  <button>Извлечь звук</button>
</form>
<p id="status" role="status"></p>
<a id="download" hidden download>Скачать MP3</a>
<script>
const form = document.querySelector('#convert');
const button = form.querySelector('button');
const status = document.querySelector('#status');
const download = document.querySelector('#download');
const video = document.querySelector('#video');

async function api(route, body) {
    const headers = {'Accept': 'application/json', 'Accept-Language': 'en'};
    const options = {headers};
    if (body) {
        headers['Content-Type'] = 'application/json';
        options.method = 'POST';
        options.body = JSON.stringify(body);
    }
    const response = await fetch('/core/api/' + route, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
}

function encode(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
    });
}

async function waitForOutput(id) {
    for (;;) {
        const outputs = await api('output-fetch/' + id);
        if (outputs.length) return outputs[0];
        const command = await api('command-inspect?identifier=' + id);
        status.textContent = 'Задача ' + id + ': ' + command.state;
        await new Promise(resolve => setTimeout(resolve, 500));
    }
}

form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    download.hidden = true;
    try {
        const file = video.files[0];
        if (file.size > 10 * 1024 * 1024) throw new Error('Максимум 10 МиБ.');
        const timestamp = Math.floor(Date.now() / 1000);
        status.textContent = 'Загрузка видео…';
        const participant = await api('participant-create', {
            timestamp, locale: navigator.language, platform: 'browser'
        });
        const reply = await api('command-create', {
            timestamp, content: file.name, participant: participant.identifier,
            state: 'queued', enqueued: timestamp, video: await encode(file)
        });
        const output = reply.output || await waitForOutput(reply.command.identifier);
        if (output.state === 'failed') throw new Error(output.exception);
        status.textContent = output.result === 'test' ? 'Тестовый режим' : 'Готово';
        if (output.result.startsWith('/audio/')) {
            download.href = output.result;
            download.hidden = false;
        }
    } catch (error) {
        status.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
